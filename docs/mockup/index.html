<style>
  :root{
    --black:#000; --base:#121212; --elev:#1a1a1a; --hover:#1f1f1f;
    --text:#fff; --text2:#b3b3b3; --text3:#6a6a6a;
    --green:#1ed760; --green-2:#1db954;
    --row-hover:rgba(255,255,255,.06); --row-active:rgba(255,255,255,.12);
    --nav-w:220px; --queue-w:400px; --bar-h:80px; --r:8px; --pad:24px;
    --font:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Malgun Gothic","Noto Sans KR","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--black); color:var(--text); font-family:var(--font);
    height:100%; overflow:hidden; -webkit-font-smoothing:antialiased;
    font-size:14px; line-height:1.4;
  }
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  svg{display:block;width:100%;height:100%}
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:6px;border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#555;background-clip:padding-box}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-rows:minmax(0,1fr) var(--bar-h);height:100%;gap:8px;padding:8px}
  .top{display:grid;grid-template-columns:var(--nav-w) 1fr var(--queue-w);gap:8px;min-height:0}
  .panel{background:var(--base);border-radius:var(--r);overflow:hidden;min-height:0}

  /* ---------- left nav ---------- */
  .nav{display:flex;flex-direction:column;gap:8px;min-height:0}
  .navTop{background:var(--base);border-radius:var(--r);padding:8px 6px;display:flex;flex-direction:column;gap:2px}
  .navlink{display:flex;align-items:center;gap:16px;padding:10px 14px;border-radius:6px;color:var(--text2);font-weight:700;font-size:15px}
  .navlink .ic{width:24px;height:24px;flex:none}
  .navlink:hover{color:var(--text)}
  .navlink.active{color:var(--text)}
  .navLib{background:var(--base);border-radius:var(--r);flex:1;display:flex;flex-direction:column;min-height:0}
  .navLibHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
  .navLibTitle{display:flex;align-items:center;gap:12px;color:var(--text2);font-weight:700}
  .navLibTitle .ic{width:24px;height:24px}
  .iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--text2)}
  .iconbtn .ic{width:16px;height:16px}
  .iconbtn:hover{color:var(--text);background:var(--hover)}
  .navLibList{overflow-y:auto;padding:4px 8px 8px;display:flex;flex-direction:column;gap:2px}
  .plItem{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px;text-align:left;width:100%}
  .plItem:hover{background:var(--hover)}
  .plItem.active{background:var(--row-active)}
  .plCover{width:48px;height:48px;border-radius:4px;flex:none;background:#333;overflow:hidden;position:relative}
  .plCover.round{border-radius:50%}
  .plMeta{min-width:0}
  .plName{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plName.green{color:var(--green)}
  .plSub{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .addZone{margin:8px;padding:14px;border:2px dashed #2a2a2a;border-radius:8px;color:var(--text3);font-size:12px;text-align:center}

  /* ---------- main ---------- */
  .main{overflow-y:auto;position:relative}
  .pageHead{padding:56px var(--pad) 24px;display:flex;gap:24px;align-items:flex-end;position:relative}
  .pageHead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.6));pointer-events:none;z-index:0}
  .pageHead>*{position:relative;z-index:1}
  .headArt{width:210px;height:210px;border-radius:6px;flex:none;box-shadow:0 8px 32px rgba(0,0,0,.5);overflow:hidden}
  .headArt.round{border-radius:50%}
  .mosaic{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%}
  .eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .headTitle{font-size:clamp(40px,6vw,88px);font-weight:800;letter-spacing:-.04em;line-height:.98;margin:8px 0 16px;text-wrap:balance}
  .headMeta{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2);flex-wrap:wrap}
  .headMeta b{color:var(--text);font-weight:700}
  .dot{color:var(--text2)}

  .pageBody{padding:0 var(--pad) 24px;position:relative}
  .actionRow{display:flex;align-items:center;gap:24px;padding:20px var(--pad)}
  .playBig{width:56px;height:56px;border-radius:50%;background:var(--green);color:#000;display:grid;place-items:center;flex:none;transition:transform .1s,background .1s}
  .playBig:hover{transform:scale(1.05);background:#1fdf64}
  .playBig .ic{width:24px;height:24px}
  .ghostbtn{color:var(--text2);width:32px;height:32px;display:grid;place-items:center}
  .ghostbtn.lg .ic{width:32px;height:32px}
  .ghostbtn .ic{width:24px;height:24px}
  .ghostbtn:hover{color:var(--text)}
  .ghostbtn.on{color:var(--green)}
  .spacer{flex:1}
  .sortWrap{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:14px}
  .sortSel{color:var(--text2);font-weight:600;display:flex;align-items:center;gap:6px}
  .sortSel:hover{color:var(--text)}

  /* track table */
  .thead,.trow{display:grid;grid-template-columns:24px 4fr 3fr 2fr 40px;gap:16px;align-items:center;padding:0 16px}
  .thead{height:36px;border-bottom:1px solid #ffffff1a;color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:0 8px 8px;position:sticky;top:0}
  .thead .sortable{cursor:pointer}
  .thead .sortable:hover{color:var(--text)}
  .thead .num,.trow .num{justify-self:start}
  .tlist{padding:0 8px}
  .trow{height:56px;border-radius:4px;color:var(--text2)}
  .trow:hover{background:var(--row-hover)}
  .trow.playing .ttitle,.trow.playing .num{color:var(--green)}
  .tindexwrap{width:24px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .trow .tplay{display:none;width:14px;height:14px}
  .trow:hover .tnum{display:none}
  .trow:hover .tplay{display:block}
  .tmain{display:flex;align-items:center;gap:12px;min-width:0}
  .tcover{width:40px;height:40px;border-radius:4px;flex:none;overflow:hidden}
  .tnames{min-width:0}
  .ttitle{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tartist{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tartist a:hover{color:var(--text);text-decoration:underline;cursor:pointer}
  .tcell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
  .tcell a:hover{color:var(--text);text-decoration:underline;cursor:pointer}
  .tright{display:flex;align-items:center;gap:14px;justify-content:flex-end;font-variant-numeric:tabular-nums}
  .tright .heart{opacity:0;color:var(--text2)}
  .trow:hover .tright .heart{opacity:1}
  .tright .heart .ic{width:16px;height:16px}
  .tdur{font-size:14px;color:var(--text2)}

  /* section grids (home) */
  .sectionHead{display:flex;align-items:baseline;justify-content:space-between;padding:8px var(--pad) 12px}
  .sectionHead h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
  .showall{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
  .showall:hover{color:var(--text)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:0 var(--pad) 8px}
  .card{background:var(--elev);border-radius:8px;padding:16px;transition:background .2s}
  .card:hover{background:#282828}
  .card .cardArt{width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .card.artist .cardArt{border-radius:50%}
  .card .cardTitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .cardSub{font-size:13px;color:var(--text2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card.artist{text-align:center}

  /* artist discography */
  .discAlbum{margin:8px 0 32px}
  .discHead{display:flex;gap:20px;align-items:flex-end;padding:0 16px 12px}
  .discCover{width:120px;height:120px;border-radius:6px;overflow:hidden;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .discInfo .eyebrow{color:var(--text2)}
  .discInfo h3{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
  .discActions{display:flex;align-items:center;gap:20px;margin-top:8px}
  .discActions .playBig{width:48px;height:48px}
  .discActions .playBig .ic{width:20px;height:20px}

  /* ---------- right sidebar (queue / lyrics) ---------- */
  .queue{display:flex;flex-direction:column;min-height:0}
  .queueHead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px}
  .tabs{display:flex;gap:8px}
  .tab{font-weight:700;font-size:16px;color:var(--text2);padding:2px 0;position:relative}
  .tab.active{color:var(--text)}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;border-radius:2px;background:var(--green)}
  .queueBody{overflow-y:auto;padding:0 8px 16px;flex:1}
  .qGroup{color:var(--text);font-size:16px;font-weight:700;padding:14px 8px 8px}
  .qGroup small{display:block;color:var(--text2);font-size:13px;font-weight:400}
  .qRow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px}
  .qRow:hover{background:var(--hover)}
  .qCover{width:44px;height:44px;border-radius:4px;overflow:hidden;flex:none}
  .qName{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qName.green{color:var(--green)}
  .qArtist{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* lyrics */
  .lyrics{padding:16px 12px;font-size:24px;font-weight:700;line-height:1.6;letter-spacing:-.01em}
  .lyrics .line{color:#ffffff4d;padding:4px 0;transition:color .3s}
  .lyrics .line.cur{color:var(--text)}
  .lyricsFoot{padding:16px 12px;color:var(--text3);font-size:12px}
  .lyricsFoot button{color:var(--green);font-weight:700;text-decoration:underline}
  .lyricsEmpty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--text2);text-align:center;padding:40px}
  .lyricsEmpty .ic{width:48px;height:48px;color:var(--text3)}

  /* ---------- bottom bar ---------- */
  .bar{background:var(--black);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;gap:12px}
  .npLeft{display:flex;align-items:center;gap:14px;min-width:180px}
  .npCover{width:56px;height:56px;border-radius:4px;overflow:hidden;flex:none}
  .npText{min-width:0}
  .npTitle{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .npArtist{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .npLeft .heart{color:var(--green);margin-left:6px}
  .npLeft .heart .ic{width:18px;height:18px}
  .npCenter{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(45vw,560px)}
  .controls{display:flex;align-items:center;gap:22px}
  .cbtn{color:var(--text2);width:20px;height:20px}
  .cbtn:hover{color:var(--text)}
  .cbtn.on{color:var(--green)}
  .cbtn.on{position:relative}
  .playToggle{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
  .playToggle:hover{transform:scale(1.06)}
  .playToggle .ic{width:18px;height:18px}
  .seek{display:flex;align-items:center;gap:10px;width:100%;font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums}
  .seekbar{flex:1;height:4px;background:#4d4d4d;border-radius:2px;position:relative;cursor:pointer}
  .seekfill{position:absolute;left:0;top:0;bottom:0;width:11%;background:#fff;border-radius:2px}
  .seekbar:hover .seekfill{background:var(--green)}
  .seekbar:hover .seekfill::after{content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#fff}
  .npRight{display:flex;align-items:center;justify-content:flex-end;gap:14px;min-width:180px}
  .npRight .cbtn{width:18px;height:18px}
  .volbar{width:90px;height:4px;background:#4d4d4d;border-radius:2px;position:relative;cursor:pointer}
  .volfill{position:absolute;left:0;top:0;bottom:0;width:70%;background:#fff;border-radius:2px}
  .volbar:hover .volfill{background:var(--green)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <div class="top">
    <!-- LEFT NAV -->
    <nav class="nav">
      <div class="navTop">
        <button class="navlink active" data-go="home"><span class="ic" data-ic="home"></span>Home</button>
        <button class="navlink"><span class="ic" data-ic="search"></span>Search</button>
      </div>
      <div class="navLib">
        <div class="navLibHead">
          <span class="navLibTitle"><span class="ic" data-ic="library"></span>Your Library</span>
          <button class="iconbtn" title="Create playlist"><span class="ic" data-ic="plus"></span></button>
        </div>
        <div class="navLibList" id="playlistList"></div>
        <div class="addZone">Drag a playlist file here to add<br>or press +</div>
      </div>
    </nav>

    <!-- MAIN PAGE -->
    <main class="main panel" id="main"></main>

    <!-- QUEUE / LYRICS -->
    <aside class="queue panel">
      <div class="queueHead">
        <div class="tabs">
          <button class="tab active" data-tab="queue">Queue</button>
          <button class="tab" data-tab="lyrics">Lyrics</button>
        </div>
        <button class="iconbtn" title="Hide"><span class="ic" data-ic="close"></span></button>
      </div>
      <div class="queueBody" id="queueBody"></div>
    </aside>
  </div>

  <!-- BOTTOM BAR -->
  <footer class="bar">
    <div class="npLeft" id="npLeft"></div>
    <div class="npCenter">
      <div class="controls">
        <button class="cbtn on" title="Shuffle"><span class="ic" data-ic="shuffle"></span></button>
        <button class="cbtn" title="Previous" data-act="prev"><span class="ic" data-ic="prev"></span></button>
        <button class="playToggle" id="playToggle" title="Play/Pause"><span class="ic" data-ic="pause"></span></button>
        <button class="cbtn" title="Next" data-act="next"><span class="ic" data-ic="next"></span></button>
        <button class="cbtn" title="Repeat"><span class="ic" data-ic="repeat"></span></button>
      </div>
      <div class="seek">
        <span id="elapsed">0:13</span>
        <div class="seekbar" id="seekbar"><div class="seekfill" id="seekfill"></div></div>
        <span id="total">3:03</span>
      </div>
    </div>
    <div class="npRight">
      <button class="cbtn on" title="Queue" data-tab="queue"><span class="ic" data-ic="queue"></span></button>
      <button class="cbtn" title="Lyrics" data-tab="lyrics"><span class="ic" data-ic="mic"></span></button>
      <span class="cbtn" title="Volume"><span class="ic" data-ic="volume"></span></span>
      <div class="volbar"><div class="volfill"></div></div>
    </div>
  </footer>
</div>

<script>
/* ============================ icons ============================ */
const ICONS = {

  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  library:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 22V8h2v14zm4 0V2h2v20zm5 0V2l8 20z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.2v14H7zm6.8 0H17v14h-3.2z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zm12 0v14l-9.2-7z"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5v14l9.2-7z"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h4v4"/><path d="M4 20 20 4"/><path d="M20 16v4h-4"/><path d="M14.5 14.5 20 20"/><path d="M4 4l5 5"/></svg>',
  repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3.5 3.5L17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h13.5"/><path d="M7 22l-3.5-3.5L7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3.5"/></svg>',
  queue:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h13M4 12h13M4 18h9M18 15v6l4-3z" fill="currentColor" stroke="none"/><path d="M4 6h13M4 12h13M4 18h9"/></svg>',
  volume:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h3.5L13 20V4L7.5 9z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3l-1.4-1.3C5.4 14.4 2 11.3 2 7.6 2 4.9 4.1 3 6.8 3c1.6 0 3.2.8 4.2 2 .9-1.2 2.5-2 4.2-2C17.9 3 20 4.9 20 7.6c0 3.7-3.4 6.8-8.6 11.4z"/></svg>',
  heartline:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.3l-1.4-1.3C5.4 14.4 2 11.3 2 7.6 2 4.9 4.1 3 6.8 3c1.6 0 3.2.8 4.2 2 .9-1.2 2.5-2 4.2-2C17.9 3 20 4.9 20 7.6c0 3.7-3.4 6.8-8.6 11.4z"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2" stroke-linecap="round"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M6 11a6 6 0 0 0 12 0M12 19v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
};
function paintIcons(root){(root||document).querySelectorAll('.ic[data-ic]').forEach(function(e){e.innerHTML=ICONS[e.dataset.ic]||''});}

/* ============================ cover art (deterministic gradient) ============================ */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function cover(seed){const h=hash(seed);const a=h%360,b=(a+35+h%70)%360;return 'linear-gradient(135deg,hsl('+a+' 58% 46%),hsl('+b+' 62% 26%))'}
function mosaic(seeds){return '<div class="mosaic">'+seeds.slice(0,4).map(function(s){return '<div style="background:'+cover(s)+'"></div>'}).join('')+'</div>'}
function headHue(seed){const h=hash(seed)%360;return 'hsl('+h+' 42% 34%)'}

  T('Supersonic','fromis_9','Supersonic','Jul 1, 2024','3:05'),
  T('DALLA DALLA','ITZY',"IT'z Different",'Jan 17, 2026','3:20'),
  T('WANNABE','ITZY',"IT'z ME",'Mar 9, 2024','3:11'),
  T('LOCO','ITZY','CRAZY IN LOVE','Sep 24, 2024','3:31'),
  T('ANTIFRAGILE','LE SSERAFIM','ANTIFRAGILE','Oct 17, 2024','3:11'),
  T('EASY','LE SSERAFIM','EASY','Feb 19, 2025','2:32'),
  T('Psycho','Red Velvet','The ReVe Festival Finale','Dec 23, 2024','3:30'),
  T('Feel My Rhythm','Red Velvet','The ReVe Festival 2022','Mar 21, 2024','3:35'),
  T('LOVE DIVE','IVE','LOVE DIVE','Apr 5, 2024','2:57'),
  T('I AM','IVE',"I've IVE",'Apr 10, 2024','3:04'),
  T('O.O','NMIXX','AD MARE','Feb 22, 2024','3:28'),
  T('Love Me Like This','NMIXX','expérgo','Mar 20, 2024','3:00'),
  T('Fancy','TWICE','FANCY YOU','May 2, 2024','3:34'),
  T('The Feels','TWICE','Formula of Love','Nov 12, 2024','3:17'),
  T('FOREVER 1',"Girls' Generation",'FOREVER 1','Aug 5, 2024','3:26'),
  T('Into the New World',"Girls' Generation","Girls' Generation",'Nov 1, 2024','4:15'),
];
const artistNames=['aespa','fromis_9','ITZY','LE SSERAFIM','Red Velvet','IVE','NMIXX','TWICE',"Girls' Generation",'STAYC'];
const playlists=[
  {id:'liked',name:'Liked Songs',owner:'apip',special:true,round:false,pin:true,count:328,tracks:pool.slice(2,20)},
  {id:'korean',name:'Korean',owner:'apip',count:507,duration:'27 hr 27 min',tracks:pool.slice()},
  {id:'fromis',name:'fromis_9',owner:'apip',count:84,tracks:pool.filter(t=>t.artist==='fromis_9')},
  {id:'bunnies',name:'mode bunnies',owner:'apip',count:41,tracks:pool.slice(10,22)},
  {id:'jepun',name:'Jepun',owner:'apip',count:63,tracks:pool.slice(0,12)},
  {id:'idle',name:'i-dle',owner:'apip',count:29,tracks:pool.slice(13,24)},
  {id:'yuutsu',name:'憂鬱な道',owner:'apip',count:52,tracks:pool.slice(4,18)},
  {id:'lovemaybe',name:'Love, Maybe',owner:'apip',count:18,tracks:pool.slice(0,9)},
];
const extraAlbums={
  fromis_9:[
    {title:'LIKE YOU BETTER (Japanese ver.)',type:'EP',year:2026,tracks:[['LIKE YOU BETTER - Japanese ver.','3:07'],['Love=Disaster - Japanese ver.','2:36'],['Sky Runner','3:32'],['LIKE YOU BETTER - Instrumental','3:06'],['Love=Disaster - Instrumental','2:36'],['Sky Runner - Instrumental','3:31']]},
    {title:'from our Memento Box',type:'EP',year:2022,tracks:[['DM','3:29'],['Stay This Way','3:12'],['FUN!','3:03'],['Movin’','3:20'],['Escape Room','3:23']]},
  ],
  aespa:[
    {title:'Armageddon - The 1st Album',type:'Album',year:2024,tracks:[['Supernova','2:58'],['Armageddon','3:16'],['BAHAMA','3:11'],['Live My Life','2:39'],['Set The Tone','3:22']]},
    {title:'Black Mamba',type:'Single',year:2020,tracks:[['Black Mamba','2:55']]},
  ],
};
function artistDiscography(name){
  if(extraAlbums[name])return extraAlbums[name];
  const byAlbum={};
  pool.filter(t=>t.artist===name).forEach(function(t){(byAlbum[t.album]=byAlbum[t.album]||[]).push([t.title,t.dur])});
  const albums=Object.keys(byAlbum).map(function(a){return {title:a,type:'Album',year:2024,tracks:byAlbum[a]}});
  return albums.length?albums:[{title:name+' — Singles',type:'Playlist',year:2024,tracks:pool.slice(0,5).map(t=>[t.title,t.dur])}];
}
const queueNext=[['BEAUTIFUL MONSTER','STAYC'],['Pretty Please','Hearts2Hearts'],['On The Ground','ROSÉ'],['RUN','Sorn'],['Clues','Ashley Alisha'],['Psycho','Red Velvet'],['Bon voyage','YooA'],['Black Mamba','aespa'],['Play No Games','Henry Young, Ashley Alisha'],['HOT','LE SSERAFIM'],['28 Reasons','SEULGI'],['Supernova Love','Aiden'],['ANTIFRAGILE','LE SSERAFIM'],['O.O','NMIXX'],['Fancy','TWICE'],['LOVE DIVE','IVE'],['WANNABE','ITZY'],['Feel My Rhythm','Red Velvet']];
const lyricsLines=['Everybody FUN! (FUN!)','오늘은 맘껏 웃을래','복잡한 건 잠시 접어둘래','We gon’ have some FUN tonight','빛나는 이 순간을 봐','Turn it up, turn it up now','너와 나, 이 밤을 춤춰','Everybody FUN!'];
let curLyric=3;

/* ============================ state ============================ */
let currentTrack={title:'FUN!',artist:'fromis_9',album:'from our Memento Box',context:'Korean'};
let playing=true, elapsed=13, total=183;
let activePlaylist='korean', sortKey='Artist';

/* ============================ render: nav ============================ */
function renderNav(){
  const el=document.getElementById('playlistList');
  el.innerHTML=playlists.map(function(p){
    const art=p.special
      ? '<div class="plCover" style="background:linear-gradient(135deg,#4300b0,#8b6cff);display:grid;place-items:center"><span style="width:20px;height:20px" class="ic">'+ICONS.heart+'</span></div>'
      : '<div class="plCover">'+mosaic(p.tracks.map(t=>t.album))+'</div>';
    return '<button class="plItem'+(p.id===activePlaylist?' active':'')+'" data-go="playlist" data-id="'+p.id+'">'+
      art+'<div class="plMeta"><div class="plName'+(p.id===activePlaylist?' green':'')+'">'+esc(p.name)+'</div>'+
      '<div class="plSub">Playlist · '+p.count+' songs</div></div></button>';
  }).join('');
}

/* ============================ render: pages ============================ */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function trackTable(tracks,opts){
  opts=opts||{};
  const head='<div class="thead"><span class="num">#</span>'+
    '<span class="sortable" data-sort="'+(opts.firstCol||'Title')+'">'+(opts.firstCol||'Title')+(sortKey===(opts.firstCol||'Title')?' ↓':'')+'</span>'+
    '<span class="sortable" data-sort="Album">Album'+(sortKey==='Album'?' ↓':'')+'</span>'+
    '<span class="sortable" data-sort="Date added">Date added'+(sortKey==='Date added'?' ↓':'')+'</span>'+
    '<span style="justify-self:end"><span class="ic" style="width:16px;height:16px;color:var(--text2)">'+ICONS.clock+'</span></span></div>';
  const rows=tracks.map(function(t,i){
    const isPlaying=t.title===currentTrack.title;
    return '<div class="trow'+(isPlaying?' playing':'')+'" data-play="'+esc(t.title)+'|'+esc(t.artist)+'|'+esc(t.album)+'">'+
      '<span class="tindexwrap"><span class="tnum num">'+(i+1)+'</span><span class="ic tplay" style="color:var(--text)">'+ICONS.play+'</span></span>'+
      '<div class="tmain"><div class="tcover">'+mosaic([t.album,t.artist])+'</div>'+
        '<div class="tnames"><div class="ttitle">'+esc(t.title)+'</div>'+
        '<div class="tartist"><a data-go="artist" data-id="'+esc(t.artist)+'">'+esc(t.artist)+'</a></div></div></div>'+
      '<div class="tcell"><a>'+esc(t.album)+'</a></div>'+
      '<div class="tcell">'+esc(t.added)+'</div>'+
      '<div class="tright"><span class="heart"><span class="ic">'+ICONS.heartline+'</span></span><span class="tdur">'+t.dur+'</span></div>'+
    '</div>';
  }).join('');
  return head+'<div class="tlist">'+rows+'</div>';
}

function renderPlaylist(id){
  const p=playlists.find(x=>x.id===id)||playlists[1];
  activePlaylist=id;
  let tracks=p.tracks.slice();
  const key=sortKey;
  tracks.sort(function(a,b){
    const f=key==='Album'?'album':key==='Date added'?'added':key==='Title'?'title':'artist';
    return String(a[f]).localeCompare(String(b[f]));
  });
  const art=p.special
    ? '<div class="headArt" style="background:linear-gradient(135deg,#4300b0,#8b6cff);display:grid;place-items:center"><span class="ic" style="width:72px;height:72px">'+ICONS.heart+'</span></div>'
    : '<div class="headArt">'+mosaic(p.tracks.map(t=>t.album))+'</div>';
  document.getElementById('main').innerHTML=
    '<div class="pageHead" style="background:linear-gradient(180deg,'+headHue(p.name)+',var(--base) 340px)">'+art+
      '<div class="headText"><div class="eyebrow">Public Playlist</div>'+
      '<h1 class="headTitle">'+esc(p.name)+'</h1>'+
      '<div class="headMeta"><b>'+esc(p.owner)+'</b><span class="dot">·</span>'+p.count+' songs'+(p.duration?', <span style="color:var(--text2)">'+p.duration+'</span>':'')+'</div></div></div>'+
    '<div class="actionRow"><button class="playBig"><span class="ic">'+ICONS.play+'</span></button>'+
      '<button class="ghostbtn lg on" title="Shuffle"><span class="ic">'+ICONS.shuffle+'</span></button>'+
      '<button class="ghostbtn lg" title="More"><span class="ic">'+ICONS.dots+'</span></button>'+
      '<div class="spacer"></div>'+
      '<div class="sortWrap"><button class="sortSel" id="sortBtn">'+sortKey+' <span class="ic" style="width:16px;height:16px">'+ICONS.queue+'</span></button></div></div>'+
    '<div class="pageBody">'+trackTable(tracks,{firstCol:'Artist'})+'</div>';
}

function renderArtist(name){
  const albums=artistDiscography(name);
  const totalSongs=albums.reduce((n,a)=>n+a.tracks.length,0);
  let html='<div class="pageHead round" style="background:linear-gradient(180deg,'+headHue(name)+',var(--base) 340px)">'+
    '<div class="headArt round">'+mosaic([name,name+'x',name+'y',name+'z'])+'</div>'+
    '<div class="headText"><div class="eyebrow">Artist</div><h1 class="headTitle">'+esc(name)+'</h1>'+
    '<div class="headMeta"><b>'+albums.length+'</b> releases <span class="dot">·</span> '+totalSongs+' songs in your library</div></div></div>'+
    '<div class="actionRow"><button class="playBig"><span class="ic">'+ICONS.play+'</span></button>'+
      '<button class="ghostbtn lg on"><span class="ic">'+ICONS.shuffle+'</span></button>'+
      '<button class="ghostbtn lg"><span class="ic">'+ICONS.heartline+'</span></button>'+
      '<button class="ghostbtn lg"><span class="ic">'+ICONS.dots+'</span></button></div>'+
    '<div class="pageBody">';
  albums.forEach(function(al){
    const rows=al.tracks.map(function(tr,i){
      const playingRow=tr[0]===currentTrack.title;
      return '<div class="trow'+(playingRow?' playing':'')+'" data-play="'+esc(tr[0])+'|'+esc(name)+'|'+esc(al.title)+'">'+
        '<span class="tindexwrap"><span class="tnum num">'+(i+1)+'</span><span class="ic tplay" style="color:var(--text)">'+ICONS.play+'</span></span>'+
        '<div class="tmain"><div class="tnames"><div class="ttitle">'+esc(tr[0])+'</div>'+
        '<div class="tartist">'+esc(name)+'</div></div></div>'+
        '<div class="tcell" style="color:var(--text2)">'+esc(al.title)+'</div><div class="tcell"></div>'+
        '<div class="tright"><span class="heart"><span class="ic">'+ICONS.heartline+'</span></span><span class="tdur">'+tr[1]+'</span></div></div>';
    }).join('');
    html+='<div class="discAlbum"><div class="discHead">'+
      '<div class="discCover">'+mosaic([al.title,name])+'</div>'+
      '<div class="discInfo"><div class="eyebrow">'+al.type+'</div><h3>'+esc(al.title)+'</h3>'+
      '<div class="headMeta">'+al.year+' <span class="dot">·</span> '+al.tracks.length+' songs</div>'+
      '<div class="discActions"><button class="playBig"><span class="ic">'+ICONS.play+'</span></button>'+
      '<button class="ghostbtn"><span class="ic">'+ICONS.heartline+'</span></button>'+
      '<button class="ghostbtn"><span class="ic">'+ICONS.dots+'</span></button></div></div></div>'+
      '<div class="tlist">'+rows+'</div></div>';
  });
  html+='</div>';
  document.getElementById('main').innerHTML=html;
}

function renderHome(){
  const plCards=playlists.map(function(p){
    const art=p.special?'<div class="cardArt" style="background:linear-gradient(135deg,#4300b0,#8b6cff)"></div>':'<div class="cardArt">'+mosaic(p.tracks.map(t=>t.album))+'</div>';
    return '<button class="card" data-go="playlist" data-id="'+p.id+'" style="text-align:left">'+art+
      '<div class="cardTitle">'+esc(p.name)+'</div><div class="cardSub">Playlist · '+p.count+' songs</div></button>';
  }).join('');
  const arCards=artistNames.map(function(a){
    return '<button class="card artist" data-go="artist" data-id="'+esc(a)+'"><div class="cardArt">'+mosaic([a,a+'1',a+'2',a+'3'])+'</div>'+
      '<div class="cardTitle">'+esc(a)+'</div><div class="cardSub">Artist</div></button>';
  }).join('');
  document.getElementById('main').innerHTML=
    '<div style="height:16px"></div>'+
    '<div class="sectionHead"><h2>Your Playlists</h2><a class="showall">Show all</a></div>'+
    '<div class="grid">'+plCards+'</div>'+
    '<div class="sectionHead" style="margin-top:12px"><h2>Artists in your library</h2><a class="showall">Show all</a></div>'+
    '<div class="grid">'+arCards+'</div><div style="height:16px"></div>';
}

/* ============================ render: queue / lyrics ============================ */
let rightTab='queue';
function renderRight(){
  const body=document.getElementById('queueBody');
  if(rightTab==='queue'){
    body.innerHTML=
      '<div class="qGroup">Now playing</div>'+
      '<div class="qRow"><div class="qCover">'+mosaic([currentTrack.album,currentTrack.artist])+'</div>'+
        '<div style="min-width:0"><div class="qName green">'+esc(currentTrack.title)+'</div><div class="qArtist">'+esc(currentTrack.artist)+'</div></div></div>'+
      '<div class="qGroup">Next from: '+esc(currentTrack.context)+'</div>'+
      queueNext.map(function(q){return '<div class="qRow"><div class="qCover">'+mosaic([q[0],q[1]])+'</div>'+
        '<div style="min-width:0"><div class="qName">'+esc(q[0])+'</div><div class="qArtist">'+esc(q[1])+'</div></div></div>'}).join('');
  }else{
    body.innerHTML=
      '<div class="lyrics">'+lyricsLines.map(function(l,i){return '<div class="line'+(i===curLyric?' cur':'')+'">'+esc(l)+'</div>'}).join('')+'</div>'+
      '<div class="lyricsFoot">Lyrics loaded from <code>FUN!.lrc</code> beside the track. <button id="noLyrics">Show fallback state</button></div>';
  }
}
function renderNoLyrics(){
  document.getElementById('queueBody').innerHTML=
    '<div class="lyricsEmpty"><span class="ic">'+ICONS.mic+'</span><div style="font-weight:700;color:var(--text)">No lyrics found</div>'+
    '<div>No <code>.lrc</code> or <code>.txt</code> beside this track, and none from ESLyric.</div>'+
    '<button class="lyricsFoot" style="color:var(--green);font-weight:700" id="backLyrics">Back to demo lyrics</button></div>';
}

/* ============================ now playing bar ============================ */
function renderNowPlaying(){
  document.getElementById('npLeft').innerHTML=
    '<div class="npCover">'+mosaic([currentTrack.album,currentTrack.artist])+'</div>'+
    '<div class="npText"><div class="npTitle">'+esc(currentTrack.title)+'</div><div class="npArtist">'+esc(currentTrack.artist)+'</div></div>'+
    '<button class="heart"><span class="ic">'+ICONS.heart+'</span></button>';
  document.getElementById('total').textContent=fmt(total);
}
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tickUI(){document.getElementById('elapsed').textContent=fmt(elapsed);document.getElementById('seekfill').style.width=(elapsed/total*100)+'%'}

/* ============================ navigation ============================ */
let view={page:'home',id:null};
function navigate(page,id){
  view={page,id};
  if(page==='home')renderHome();
  else if(page==='playlist')renderPlaylist(id);
  else if(page==='artist')renderArtist(id);
  paintIcons(document.getElementById('main'));
  document.querySelectorAll('.navlink').forEach(n=>n.classList.toggle('active',n.dataset.go==='home'&&page==='home'));
  renderNav();
  document.getElementById('main').scrollTop=0;
}
function rerender(){navigate(view.page,view.id)}

function setNowPlaying(title,artist,album){
  currentTrack={title,artist,album,context:(playlists.find(p=>p.id===activePlaylist)||{}).name||'Library'};
  elapsed=0;total=180+ (hash(title)%80);
  playing=true;setPlayIcon();
  renderNowPlaying();renderRight();rerender();
}
function setPlayIcon(){document.querySelector('#playToggle .ic').innerHTML=playing?ICONS.pause:ICONS.play}

/* ============================ events ============================ */
document.addEventListener('click',function(e){
  const go=e.target.closest('[data-go]');
  if(go){navigate(go.dataset.go,go.dataset.id);return}
  const playRow=e.target.closest('[data-play]');
  if(playRow){const p=playRow.dataset.play.split('|');setNowPlaying(p[0],p[1],p[2]);return}
  const tab=e.target.closest('[data-tab]');
  if(tab){rightTab=tab.dataset.tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===rightTab));document.querySelector('.npRight [data-tab="queue"]').classList.toggle('on',rightTab==='queue');renderRight();paintIcons(document.getElementById('queueBody'));return}
  const sortBtn=e.target.closest('#sortBtn');
  if(sortBtn){const order=['Artist','Title','Album','Date added'];sortKey=order[(order.indexOf(sortKey)+1)%order.length];rerender();return}
  const sortCol=e.target.closest('[data-sort]');
  if(sortCol){sortKey=sortCol.dataset.sort;rerender();return}
  if(e.target.closest('#playToggle')){playing=!playing;setPlayIcon();return}
  if(e.target.closest('#noLyrics')){renderNoLyrics();paintIcons(document.getElementById('queueBody'));return}
  if(e.target.closest('#backLyrics')){renderRight();paintIcons(document.getElementById('queueBody'));return}
  const seek=e.target.closest('#seekbar');
  if(seek){const r=seek.getBoundingClientRect();elapsed=Math.round((e.clientX-r.left)/r.width*total);tickUI();return}
});

/* ============================ init ============================ */
paintIcons(document);
renderNav();
renderNowPlaying();
renderRight();
navigate('playlist','korean');
tickUI();
setInterval(function(){if(playing){elapsed++;if(elapsed>total)elapsed=0;tickUI()}},1000);
</script>
